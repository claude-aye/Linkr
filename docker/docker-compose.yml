services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: linkr-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - linkr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: linkr-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - linkr-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: linkr-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    networks:
      - linkr-network
    depends_on:
      postgres:
        condition: service_healthy

  # Local catch-all mailbox (chantier A-1). Nothing it receives ever leaves
  # this machine, which is the point: the email foundation is exercised without
  # a provider, a domain or a DNS record. No volume on purpose — messages are
  # in-memory and a restart is the reset.
  mailpit:
    image: axllent/mailpit:latest
    container_name: linkr-mailpit
    ports:
      - "1025:1025"   # SMTP  — what the API talks to
      - "8025:8025"   # HTTP  — the web UI, http://localhost:8025
    networks:
      - linkr-network

networks:
  linkr-network:
    driver: bridge
